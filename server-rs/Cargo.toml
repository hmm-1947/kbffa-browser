[package]
name = "kbffa-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kbffa-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
http-body-util = "0.1"
tokio-util = "0.7"
hyper-tungstenite = "0.15"
rand = "0.8"
mime_guess = "2"
