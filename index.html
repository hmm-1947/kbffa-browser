<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KBFFA</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <canvas id="c"></canvas>
  <div id="adLayer"></div>
  <div id="hud"></div>
  <div id="menu">
    <div class="sl-header"><div id="slTitle" class="sl-title"></div></div>
    <div id="serverList" class="sl-list" tabindex="-1"></div>
    <div id="slScroll" class="sl-sb"><div class="sl-sb-thumb"></div></div>
    <div id="joinError" class="sl-error"></div>
    <div id="lobbyStats" class="sl-tooltip"></div>
    <div class="sl-footer">
      <div class="sl-row">
        <button id="joinServer" type="button" class="mc-btn sl-w100">Join Server</button>
        <div class="sl-edit sl-w100" id="playerNameBox"><input id="playerName" maxlength="16" autocomplete="username" spellcheck="false"><div class="sl-edit-view" id="playerNameView"></div></div>
        <button id="statsButton" type="button" class="mc-btn sl-w100">Statistics</button>
      </div>
      <div class="sl-row">
        <button id="refreshServers" type="button" class="mc-btn sl-w74">Refresh</button>
      </div>
    </div>
  </div>
  <div id="pauseBlur"></div>
  <div id="pause" class="mc-screen">
    <div class="mc-title">Game menu</div>
    <div class="mc-buttons">
      <button id="btnResume" class="mc-btn">Back to game</button>
      <button id="btnBackToServerList" class="mc-btn">Back to server list</button>
      <button id="btnStats" class="mc-btn">Statistics</button>
      <button id="btnChangeBlocks" class="mc-btn">Change Blocks...</button>
      <button id="btnControls" class="mc-btn">Controls...</button>
      <button id="btnOptions" class="mc-btn">Options...</button>
    </div>
  </div>
  <div id="options" class="mc-screen">
    <div class="mc-title">Options</div>
    <div class="mc-row">
      <span class="mc-label">Sprint</span>
      <button id="btnToggleSprint" class="mc-btn mc-wide"></button>
    </div>
    <div class="mc-row">
      <span class="mc-label">Mouse Sensitivity</span>
      <div class="mc-slider" id="sldSens"><div class="mc-slider-fill"></div><div class="mc-slider-label"></div></div>
    </div>
    <div class="mc-row">
      <span class="mc-label">FOV</span>
      <div class="mc-slider" id="sldFov"><div class="mc-slider-fill"></div><div class="mc-slider-label"></div></div>
    </div>
    <div class="mc-row">
      <span class="mc-label">GUI Scale</span>
      <button id="btnGuiScale" class="mc-btn mc-wide"></button>
    </div>
    <div class="mc-row">
      <span class="mc-label">Master Volume</span>
      <div class="mc-slider" id="sldVolume"><div class="mc-slider-fill"></div><div class="mc-slider-label"></div></div>
    </div>
    <div class="mc-buttons">
      <button id="btnHotbarOpen" class="mc-btn">Customize Hotbar...</button>
      <button id="btnChatSettingsOpen" class="mc-btn">Chat Settings...</button>
      <button id="btnResetSettings" class="mc-btn">Reset to Default</button>
      <button id="btnOptionsDone" class="mc-btn">Done</button>
    </div>
  </div>
  <div id="controls" class="mc-screen">
    <div class="mc-title">Controls</div>
    <div class="mc-controls-list" id="controlsList"></div>
    <div class="mc-buttons">
      <button id="btnControlsDone" class="mc-btn">Done</button>
    </div>
  </div>
  <div id="stats" class="mc-screen mc-screen-wide">
    <div class="mc-title">Statistics</div>
    <div class="mc-buttons mc-buttons-row mc-stats-tabs">
      <button id="btnStatsOnline" class="mc-btn">Online</button>
      <button id="btnStatsOffline" class="mc-btn">Offline</button>
      <button id="btnStatsAll" class="mc-btn">All</button>
    </div>
    <div class="mc-row">
      <span class="mc-label">Sort by</span>
      <button id="btnStatsSort" class="mc-btn mc-wide">Kills</button>
    </div>
    <div class="mc-stats-header">
      <span class="mc-stats-col-name">Name</span>
      <span class="mc-stats-col">Kills</span>
      <span class="mc-stats-col">Deaths</span>
      <span class="mc-stats-col">Streak</span>
      <span class="mc-stats-col">Pearls</span>
      <span class="mc-stats-col">Blocks</span>
    </div>
    <div class="mc-stats-list" id="statsList"></div>
    <div class="mc-buttons">
      <button id="btnStatsDone" class="mc-btn">Done</button>
    </div>
  </div>
  <div id="chatSettings" class="mc-screen">
    <div class="mc-title">Chat Settings</div>
    <div class="mc-buttons mc-buttons-row mc-chatpos-tabs">
      <button id="btnChatTL" class="mc-btn">Top Left</button>
      <button id="btnChatTR" class="mc-btn">Top Right</button>
      <button id="btnChatBL" class="mc-btn">Bottom Left</button>
      <button id="btnChatBR" class="mc-btn">Bottom Right</button>
    </div>
    <div class="mc-row">
      <span class="mc-label">Chat Length</span>
      <div class="mc-slider" id="sldChatLen"><div class="mc-slider-fill"></div><div class="mc-slider-label"></div></div>
    </div>
    <div class="mc-row">
      <span class="mc-label">Chat Text Opacity</span>
      <div class="mc-slider" id="sldChatTextOpacity"><div class="mc-slider-fill"></div><div class="mc-slider-label"></div></div>
    </div>
    <div class="mc-row">
      <span class="mc-label">Text Background Opacity</span>
      <div class="mc-slider" id="sldChatOpacity"><div class="mc-slider-fill"></div><div class="mc-slider-label"></div></div>
    </div>
    <div class="mc-buttons">
      <button id="btnChatSettingsDone" class="mc-btn">Done</button>
    </div>
  </div>
  <div id="blockPicker" class="mc-screen">
    <div class="mc-title">Change Blocks</div>
    <div id="chestBox" class="chest"></div>
    <div class="mc-buttons">
      <button id="btnBlockPickerDone" class="mc-btn">Done</button>
    </div>
  </div>
  <div id="hotbarEditor" class="mc-screen">
    <div class="mc-title">Customize Hotbar</div>
    <div id="heBar" class="he-bar"></div>
    <div class="mc-buttons mc-buttons-row he-buttons">
      <button id="btnHotbarSave" class="mc-btn">Save</button>
      <button id="btnHotbarReset" class="mc-btn">Reset</button>
      <button id="btnHotbarCancel" class="mc-btn">Cancel</button>
    </div>
  </div>
  <div id="heCursor" class="he-cursor"></div>
  <div id="chatWrap">
    <div id="chatLog"></div>
    <div id="chatBox"><input id="chatInput" type="text" maxlength="256" autocomplete="off" spellcheck="false"><div id="chatView"></div></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
